<!DOCTYPE html>
<html>
<head>
  <title>Nearby Hospitals & Pharmacies</title>
  <style>
    #map { height: 100vh; width: 100%; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Nearby Hospitals & Pharmacies</h2>
  <div id="map"></div>

  <script>
    let map;
    const predefinedLocation = { lat: 23.8103, lng: 90.4125 }; // Change to your location

    function initMap() {
      // Initialize map
      map = new google.maps.Map(document.getElementById("map"), {
        zoom: 14,
        center: predefinedLocation
      });

      // Blue marker for your location
      new google.maps.Marker({
        position: predefinedLocation,
        map: map,
        title: "Predefined Location",
        icon: "http://maps.google.com/mapfiles/ms/icons/blue-dot.png"
      });

      const infoWindow = new google.maps.InfoWindow();
      const service = new google.maps.places.PlacesService(map);
      const types = ["hospital", "pharmacy"];

      types.forEach(type => {
        const request = {
          location: predefinedLocation,
          radius: 2000,
          type: [type]
        };

        service.nearbySearch(request, (results, status) => {
          if (status === google.maps.places.PlacesServiceStatus.OK) {
            results.forEach(place => {
              const marker = new google.maps.Marker({
                position: place.geometry.location,
                map: map,
                title: place.name,
                icon: type === "hospital" 
                      ? "http://maps.google.com/mapfiles/ms/icons/red-dot.png"
                      : "http://maps.google.com/mapfiles/ms/icons/green-dot.png"
              });

              marker.addListener("click", () => {
                infoWindow.setContent(`<strong>${place.name}</strong><br>${place.vicinity}`);
                infoWindow.open(map, marker);
              });
            });
          } else {
            console.error(`❌ Error fetching ${type}: ${status}`);
          }
        });
      });
    }
  </script>

  <!-- Replace YOUR_API_KEY with your actual restricted & enabled Google Maps API key -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyC_180wWapJqYUEbRmDUEazSDSnFhAT2bA&libraries=places&callback=initMap">
  </script>
</body>
</html>
